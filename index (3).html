<!doctype html>
<html lang="ja">
<head>

<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta name="description" content="Re:VOLUTION ブラウザ版ボードゲーム">
<title>Re:VOLUTION — Board Game</title>
<style>
:root{--bg:#05070d;--panel:#0b101a;--panel2:#101827;--line:#263247;--text:#f5f7fb;--muted:#8d9aae;--red:#ff355d;--blue:#39a0ff;--gold:#ffc857;--green:#24e0a1;--cyan:#45e6ff;--purple:#a978ff;--danger:#ff6674;--shadow:0 24px 70px rgba(0,0,0,.48)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#05070d;color:var(--text);font-family:Inter,system-ui,-apple-system,"Noto Sans JP","Yu Gothic",sans-serif;-webkit-text-size-adjust:100%;overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 15% 5%,rgba(57,160,255,.14),transparent 28%),radial-gradient(circle at 88% 18%,rgba(255,53,93,.12),transparent 25%),linear-gradient(rgba(255,255,255,.018) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.018) 1px,transparent 1px);background-size:auto,auto,42px 42px,42px 42px;mask-image:linear-gradient(to bottom,#000,transparent 92%)}
button{font:inherit}button:disabled{opacity:.35;cursor:not-allowed;filter:saturate(.4)}
#app{width:min(1540px,100%);margin:auto;padding:18px}
header{position:relative;display:flex;align-items:center;justify-content:space-between;gap:18px;padding:17px 20px;background:linear-gradient(135deg,rgba(16,23,36,.94),rgba(7,11,19,.94));border:1px solid #27364c;border-radius:24px;box-shadow:var(--shadow);overflow:hidden}header:after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:linear-gradient(90deg,transparent,var(--red),var(--blue),transparent);opacity:.8}
.brand{display:flex;align-items:center;gap:15px}.mark{position:relative;width:52px;height:52px;border-radius:16px;display:grid;place-items:center;background:linear-gradient(135deg,#ff365d,#8c1232);font-size:29px;font-weight:1000;box-shadow:0 10px 28px rgba(255,53,93,.25);transform:skew(-5deg)}.mark:after{content:"";position:absolute;inset:5px;border:1px solid rgba(255,255,255,.28);border-radius:12px}.brand h1{margin:0;font-size:clamp(27px,4vw,46px);line-height:.9;font-weight:1000;font-style:italic;letter-spacing:-2.5px;text-shadow:0 0 28px rgba(57,160,255,.18)}.brand p{margin:7px 0 0;color:#7f8da1;font-size:11px;letter-spacing:2px;font-weight:800}
.top-actions{display:flex;gap:9px;flex-wrap:wrap;justify-content:flex-end}.btn{position:relative;border:1px solid #2a3a51;background:linear-gradient(180deg,#182235,#111927);color:#fff;padding:10px 14px;border-radius:13px;font-weight:900;box-shadow:0 8px 18px rgba(0,0,0,.22),inset 0 1px rgba(255,255,255,.06);transition:transform .16s,filter .16s,box-shadow .16s,border-color .16s}.btn:hover:not(:disabled){transform:translateY(-2px);filter:brightness(1.1);box-shadow:0 12px 24px rgba(0,0,0,.3),0 0 0 1px rgba(255,255,255,.04) inset}.btn:active:not(:disabled){transform:translateY(0)}.btn.primary{background:linear-gradient(135deg,#ff4164,#a91438);border-color:#ff6682;box-shadow:0 8px 24px rgba(255,53,93,.2)}.btn.green{background:linear-gradient(135deg,#20dba0,#087d5c);border-color:#49edbb}.btn.gold{background:linear-gradient(135deg,#ffd35e,#b87700);border-color:#ffe29a;color:#171107}.btn.cyan{background:linear-gradient(135deg,#4ae8ff,#167b9d);border-color:#84f3ff;color:#04161c}.btn.danger{background:linear-gradient(135deg,#ff6572,#9e1e2d);border-color:#ff9da5}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:16px;margin-top:16px}.panel,.card{background:linear-gradient(145deg,rgba(13,20,32,.96),rgba(7,11,19,.96));border:1px solid #202d40;border-radius:20px;box-shadow:var(--shadow);backdrop-filter:blur(12px)}.panel{padding:14px;min-width:0}.sidebar{display:grid;gap:12px;align-content:start;min-width:0}.card{padding:13px}.card h3{margin:0 0 11px;font-size:12px;color:#aab8ca;letter-spacing:1.4px;text-transform:uppercase}
.turnbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;background:linear-gradient(90deg,#121c2c,#0b111d);border:1px solid #27364b;border-radius:14px;margin-bottom:10px;box-shadow:inset 0 1px rgba(255,255,255,.04)}.turnbar strong{font-size:18px;letter-spacing:.2px}.badge{padding:6px 11px;border-radius:999px;background:#101f33;border:1px solid #315274;color:#8ed0ff;font-size:11px;font-weight:1000;letter-spacing:.6px}
.board-select-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 8px;padding:10px 11px;background:linear-gradient(90deg,#30240b,#171208);border:1px solid #8c6c1b;border-radius:13px;box-shadow:0 0 24px rgba(255,200,87,.07)}.board-select-bar b{flex:1;min-width:220px}.setup-note{margin:8px 0;padding:10px 12px;border-radius:12px;background:#0e1a29;border:1px solid #2a3d55;color:#c4d2e2;font-size:13px}
.board-scroll{width:100%;max-width:100%;overflow-x:auto;overflow-y:hidden;padding:9px;border-radius:16px;background:linear-gradient(180deg,#03060b,#080d15);border:1px solid #1c2738;scrollbar-width:auto;scroll-behavior:smooth;touch-action:pan-x;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch;cursor:grab}.board-scroll.dragging{cursor:grabbing;user-select:none}.board-scroll::-webkit-scrollbar{height:14px}.board-scroll::-webkit-scrollbar-track{background:#070b12;border-radius:10px}.board-scroll::-webkit-scrollbar-thumb{background:linear-gradient(90deg,#34465f,#586d8b);border-radius:10px;border:3px solid #070b12}
.board{position:relative;width:720px;min-width:720px;height:720px;background:radial-gradient(circle at 50% 45%,#151d2a 0,#0d141f 48%,#080d15 100%);border:1px solid #344258;border-radius:18px;overflow:visible;box-shadow:0 18px 45px rgba(0,0,0,.58),inset 0 0 80px rgba(0,0,0,.35)}.board:before{content:"RE:VOLUTION";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-8deg);font-size:58px;font-weight:1000;letter-spacing:7px;color:rgba(255,255,255,.035);white-space:nowrap;pointer-events:none}.board:after{content:"";position:absolute;inset:36px;border:1px solid rgba(111,139,173,.12);border-radius:10px;pointer-events:none}
.space{position:absolute;border:1px solid rgba(135,157,183,.45);background:rgba(19,28,41,.97);border-radius:9px;display:block;padding:3px;z-index:5;transition:transform .14s,box-shadow .14s,border-color .14s,filter .14s;touch-action:manipulation;overflow:hidden;box-shadow:inset 0 1px rgba(255,255,255,.08),0 5px 10px rgba(0,0,0,.24)}.space:hover{transform:translateY(-2px);z-index:12;filter:brightness(1.08);border-color:#8ca7c7}.space-info{position:absolute;inset:3px 3px 25px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;pointer-events:none;text-align:center;color:#edf4fb}.space-icon{font-size:15px;line-height:1;filter:drop-shadow(0 2px 4px rgba(0,0,0,.5))}.space-title{font-size:10px;font-weight:1000;line-height:1.05;word-break:keep-all;letter-spacing:.1px}.space-sub{font-size:10px;font-weight:1000;line-height:1;color:#ffca62}.type-go{background:linear-gradient(145deg,#45172a,#24111d);border-color:#a73b5a}.type-jail{background:linear-gradient(145deg,#3d1720,#201017);border-color:#9c3a49}.type-weapon{background:linear-gradient(145deg,#142b46,#0d1c31);border-color:#397db8}.type-event{background:linear-gradient(145deg,#3d3213,#241e0c);border-color:#a98a2b}.type-square{background:linear-gradient(145deg,#123a31,#0b241f);border-color:#278c70}.type-rail{background:linear-gradient(145deg,#2a3039,#171c24);border-color:#697587}.type-checkpoint{background:linear-gradient(145deg,#473016,#271c0d);border-color:#b67a29}.type-power{background:linear-gradient(145deg,#113743,#0b2029);border-color:#3b9db7}.type-casino{background:linear-gradient(145deg,#34234d,#1d152c);border-color:#8859ba}.type-land{background:linear-gradient(145deg,#242c39,#161d28);border-color:#4c5d73}.type-land .space-sub{color:#8bd0ff}.space.target{outline:3px solid #ffd447;outline-offset:-3px;background:rgba(255,212,71,.18);box-shadow:inset 0 0 0 999px rgba(255,212,71,.06),0 0 22px rgba(255,212,71,.45);cursor:pointer}.space.build-target{outline-color:#45b7ff;background:rgba(69,183,255,.16);box-shadow:inset 0 0 0 999px rgba(69,183,255,.06),0 0 22px rgba(69,183,255,.38)}.space.selected{outline-color:#2df0aa;background:rgba(45,240,170,.2);box-shadow:inset 0 0 0 999px rgba(45,240,170,.07),0 0 26px rgba(45,240,170,.46)}.building-marker{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:17px;font-weight:1000;text-shadow:0 2px 7px #000;background:#070b12ee;border:1px solid rgba(255,255,255,.35);border-radius:9px;padding:3px 6px;z-index:7;pointer-events:none;white-space:nowrap;box-shadow:0 5px 14px rgba(0,0,0,.35)}.tokens{position:absolute;left:50%;bottom:5px;transform:translateX(-50%);display:flex;gap:2px;z-index:9;pointer-events:none}.token{width:23px;height:23px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:1000;font-size:10px;border:2px solid #fff;box-shadow:0 4px 10px #000c}.t-cap{background:#e92d4f}.t-w1{background:#258df0}.t-w2{background:#8a58dc}.t-w3{background:#18ad79}
.board-nav{display:flex;gap:8px;justify-content:center;margin:10px 0 2px}.board-nav .btn{min-width:120px}
.controls{display:grid;grid-template-columns:1.5fr 1fr 1fr 1fr;gap:8px;margin-top:10px}.controls .btn{min-height:50px}.player{padding:11px;border:1px solid #25354a;border-left:4px solid var(--c);border-radius:13px;background:linear-gradient(135deg,#0d1724,#09111b);margin-bottom:8px;box-shadow:inset 0 1px rgba(255,255,255,.03)}.player.active{background:linear-gradient(135deg,#14263a,#0b1725);box-shadow:0 0 0 1px rgba(83,143,194,.35) inset,0 0 20px rgba(57,160,255,.07)}.player.dead{opacity:.5;filter:grayscale(.7)}.player .muted{color:var(--muted);font-size:11px}.money{font-size:21px;font-weight:1000;margin-top:2px;color:#ffd76b}.stat{display:flex;gap:10px;color:#b5c6d9;font-size:12px;margin-top:3px}.muted{color:var(--muted)}.current-box{font-size:13px;line-height:1.7;color:#dbe6f2}
.log{height:230px;overflow:auto;padding-right:5px;font-size:12px;line-height:1.65;color:#cbd8e7}.log div{padding:4px 0;border-bottom:1px solid #172438}.rules{font-size:12px;line-height:1.75;color:#bdcddd}
#modal{position:fixed;inset:0;background:rgba(1,4,8,.82);backdrop-filter:blur(10px);display:none;align-items:center;justify-content:center;padding:16px;z-index:100;overflow:auto}.modalbox{width:min(680px,100%);max-height:calc(100vh - 32px);overflow:auto;background:linear-gradient(145deg,#121c2b,#080e17);border:1px solid #3b506b;border-radius:22px;padding:19px;box-shadow:0 30px 100px #000b}.modalbox h2{margin:0 0 10px;font-size:24px}.modalbox p{color:#c5d3e2;line-height:1.7}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:12px}.choices button{border:1px solid #2f4660;background:linear-gradient(180deg,#18263a,#101a29);color:#fff;padding:12px;border-radius:13px;font-weight:900;text-align:left;transition:.15s}.choices button:hover{filter:brightness(1.12);transform:translateY(-1px)}.dice{display:flex;gap:10px;justify-content:center;margin:12px 0}.die{width:62px;height:62px;display:grid;place-items:center;background:linear-gradient(145deg,#fff,#cbd4df);color:#101722;border-radius:14px;font-size:28px;font-weight:1000;box-shadow:0 10px 25px #0008}.result{padding:11px;border-radius:13px;background:#0a1420;border:1px solid #2b425b;text-align:center;font-weight:900}
@media(max-width:980px){.layout{grid-template-columns:1fr}.sidebar{grid-template-columns:repeat(2,minmax(0,1fr))}.logcard{grid-column:1/-1}}
@media(max-width:680px){#app{padding:8px}header{padding:11px;align-items:flex-start}.top-actions{max-width:45%}.top-actions .btn{padding:8px 9px;font-size:12px}.layout{margin-top:8px}.panel{padding:8px}.sidebar{grid-template-columns:1fr}.controls{grid-template-columns:1fr 1fr}.controls .btn:first-child{grid-column:1/-1}.board-scroll{padding:4px}.board{width:720px;min-width:720px}.modalbox{max-height:calc(100vh - 20px);padding:14px}.choices{grid-template-columns:1fr}.brand h1{font-size:28px}.brand p{font-size:9px;letter-spacing:1.4px}}
.role-choice{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:16px}.role-card{border:1px solid #30445d;background:linear-gradient(145deg,#142238,#0b111c);color:#fff;padding:20px;border-radius:18px;text-align:left;cursor:pointer;transition:.18s}.role-card:hover{transform:translateY(-3px);border-color:#6d8fb5;box-shadow:0 12px 30px rgba(0,0,0,.3)}.role-card.cap{border-color:#7e2940}.role-card.worker{border-color:#286da6}.role-card strong{display:block;font-size:21px;margin-bottom:6px}.role-card span{color:#aebfd2;font-size:12px;line-height:1.6}.ai-badge{display:inline-block;margin-left:6px;padding:3px 7px;border-radius:999px;background:#1b293b;border:1px solid #39516d;color:#8fb4d9;font-size:9px;font-weight:900;vertical-align:middle}.human-badge{display:inline-block;margin-left:6px;padding:3px 7px;border-radius:999px;background:#12352c;border:1px solid #2d806b;color:#76e6c4;font-size:9px;font-weight:900;vertical-align:middle}
.dice-roll-overlay{position:fixed;inset:0;z-index:9999;display:none;align-items:center;justify-content:center;background:rgba(3,7,18,.72);backdrop-filter:blur(7px)}
.dice-roll-overlay.show{display:flex;animation:diceFade .16s ease-out}
.dice-roll-box{text-align:center;min-width:280px;padding:28px 34px;border:1px solid rgba(100,220,255,.45);border-radius:22px;background:linear-gradient(145deg,rgba(12,22,45,.97),rgba(7,12,28,.97));box-shadow:0 0 55px rgba(40,180,255,.22),inset 0 1px rgba(255,255,255,.08)}
.dice-label{font-size:14px;letter-spacing:.18em;color:#8edfff;margin-bottom:18px}.dice-stage{display:flex;justify-content:center;gap:16px;margin:8px 0 20px}.anim-die{width:72px;height:72px;display:grid;place-items:center;border-radius:16px;font-size:38px;font-weight:900;color:#fff;background:linear-gradient(145deg,#24385d,#101a32);border:1px solid rgba(140,220,255,.5);box-shadow:0 10px 25px rgba(0,0,0,.35),0 0 18px rgba(60,190,255,.18)}.anim-die.roll{animation:diceRoll .55s cubic-bezier(.2,.8,.2,1)}.dice-result{font-size:18px;font-weight:800;opacity:0;transform:translateY(8px);transition:.25s}.dice-result.show{opacity:1;transform:none}@keyframes diceRoll{0%{transform:rotate(0) scale(.75);filter:blur(2px)}45%{transform:rotate(18deg) scale(1.12)}75%{transform:rotate(-10deg) scale(.96)}100%{transform:rotate(0) scale(1);filter:none}}@keyframes diceFade{from{opacity:0}to{opacity:1}}
</style>
</head>
<body>
<div id="app">
<header><div class="brand"><div class="mark">R</div><div><h1>Re:VOLUTION</h1><p>REVOLUTIONARY BOARD GAME • SINGLE FILE</p></div></div><div class="top-actions"><button class="btn" onclick="showRules()">📖 ルール</button><button class="btn" onclick="newGame()">↻ 新しいゲーム</button></div></header>
<div class="layout">
<main class="panel">
<div class="turnbar"><strong id="turnText">ゲーム準備中</strong><span id="phase" class="badge">準備</span></div>
<div id="boardSelectBar" class="board-select-bar" style="display:none"><b id="boardSelectText"></b><button class="btn primary" onclick="confirmBoardSelection()">決定</button><button class="btn" onclick="cancelBoardSelection()">キャンセル</button></div>
<div id="setupHint" class="setup-note" style="display:none"></div>
<div class="muted" style="font-size:12px;margin:0 2px 5px">↔️ ボードは横にスクロールできます。スマホはスワイプ、PCはホイール＋ドラッグ、下のボタンでも移動できます。</div>
<div id="boardScroll" class="board-scroll"><div id="board" class="board"></div></div>
<div class="board-nav"><button class="btn" onclick="scrollBoard(-520)">◀ 左へ</button><button class="btn" onclick="scrollBoard(520)">右へ ▶</button></div>
<div class="controls"><button id="rollBtn" class="btn primary" onclick="rollDice()" disabled>🎲 サイコロを2個振る</button><button id="buyBtn" class="btn green" onclick="buyLand()" disabled>土地を買う</button><button id="buildBtn" class="btn gold" onclick="buildHere()" disabled>🏗️ 建物を建てる</button><button id="endBtn" class="btn cyan" onclick="endTurn()" disabled>⏭️ ターン終了</button></div>
</main>
<aside class="sidebar">
<div class="card"><h3>プレイヤー</h3><div id="players"></div></div>
<div class="card"><h3>現在のマス</h3><div id="current" class="current-box"></div></div>
<div class="card logcard"><h3>ゲームログ</h3><div id="log" class="log"></div></div>
<div class="card"><h3>ゲーム状態</h3><div id="status" class="rules"></div></div>
</aside>
</div></div>
<div id="modal"><div id="modalbox" class="modalbox"></div></div>
<script>
const BOARD_W=720,BOARD_H=720;
const spaces=[
{n:'スタート',t:'go'},{n:'土地',t:'land',p:160},{n:'土地',t:'land',p:140},{n:'武器屋',t:'weapon'},{n:'土地',t:'land',p:120},{n:'イベント',t:'event'},{n:'市民広場',t:'square'},{n:'土地',t:'land',p:100},{n:'鉄道',t:'rail'},{n:'検問',t:'checkpoint'},
{n:'土地',t:'land',p:140},{n:'武器屋',t:'weapon'},{n:'鉄道',t:'rail'},{n:'市民広場',t:'square'},{n:'土地',t:'land',p:140},{n:'土地',t:'land',p:150},{n:'イベント',t:'event'},{n:'土地',t:'land',p:120},{n:'Go to Jail',t:'jail'},
{n:'土地',t:'land',p:160},{n:'電力会社',t:'power'},{n:'土地',t:'land',p:140},{n:'武器屋',t:'weapon'},{n:'土地',t:'land',p:120},{n:'土地',t:'land',p:150},{n:'鉄道',t:'rail'},{n:'土地',t:'land',p:160},{n:'カジノ',t:'casino'},
{n:'土地',t:'land',p:140},{n:'武器屋',t:'weapon'},{n:'土地',t:'land',p:150},{n:'土地',t:'land',p:100},{n:'イベント',t:'event'},{n:'土地',t:'land',p:120},{n:'鉄道',t:'rail'},{n:'土地',t:'land',p:140}
];
const players=[
{id:'cap',name:'資本家',role:'capitalist',money:3500,pos:0,lands:[],build:{},weapons:0,avoidCards:0,alive:true,jail:false,color:'#e32643'},
{id:'w1',name:'労働者A',role:'worker',money:1500,pos:0,lands:[],build:{},weapons:0,avoidCards:0,alive:true,jail:false,color:'#2d8cff'},
{id:'w2',name:'労働者B',role:'worker',money:1500,pos:0,lands:[],build:{},weapons:0,avoidCards:0,alive:true,jail:false,color:'#8d58d6'},
{id:'w3',name:'労働者C',role:'worker',money:1500,pos:0,lands:[],build:{},weapons:0,avoidCards:0,alive:true,jail:false,color:'#16a76f'}];
let current=0,rolled=false,moving=false,gameOver=false,boardMode=null,initialFactoryChoices=[],doublesThisTurn=0,doubleNext=false,lastDiceSum=0,revolutionCards=0,choiceFns=[],humanRole=null,aiBusy=false,pendingDoubleRoll=false;
let shop={};
function resetShops(){shop={};spaces.forEach((s,i)=>{if(s.t==='weapon')shop[i]={available:true,blocked:false}})}
resetShops();
// 具体表が元ルールに記載されていないため、配当はここで簡単に変更できる。
const casinoPayout={2:100,3:100,4:150,5:200,6:250,7:400,8:250,9:200,10:150,11:100,12:100};
function isHuman(p){return !!p&&((humanRole==='capitalist'&&p.role==='capitalist')||(humanRole==='worker'&&p.role==='worker'&&p.id==='w1'))}
function aiWorkers(){return players.filter(p=>p.role==='worker'&&p.id!=='w1')}
function startRoleChoice(){const modal=document.getElementById('modal'),box=document.getElementById('modalbox');if(!modal||!box)return;showRoleChoice()}
function showRoleChoice(){document.getElementById('modal').style.display='flex';document.getElementById('modalbox').innerHTML=`<h2>🎮 プレイヤーを選択</h2><p>あなたが操作する役職を選んでください。残りの3役はコンピューターが自動操作します。</p><div class="role-choice"><button class="role-card cap" onclick="chooseRole('capitalist')"><strong>🔴 資本家</strong><span>資本家を自分で操作<br>労働者3人はCOM</span></button><button class="role-card worker" onclick="chooseRole('worker')"><strong>🔵 労働者</strong><span>労働者Aを自分で操作<br>資本家＋労働者B/CはCOM</span></button></div>`}
function chooseRole(role){humanRole=role;closeModal();newGame()}
function active(){return players[current]}
function spaceAt(i){return spaces[(i+spaces.length)%spaces.length]}
function money(n){return Math.round(n)+'ドル'}
function ownerOf(pos){return players.find(p=>p.alive&&p.lands.includes(pos))||null}
function buildingCount(p,pos){if(!p)return{factory:0,house:0};return p.build[pos]||(p.build[pos]={factory:0,house:0})}
function log(s){const e=document.getElementById('log');e.insertAdjacentHTML('beforeend','<div>• '+escapeHtml(s)+'</div>');e.scrollTop=e.scrollHeight}
function escapeHtml(s){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function scrollBoard(dx){const e=document.getElementById('boardScroll');e.scrollBy({left:dx,behavior:'smooth'})}
// 画像の実寸720x701に合わせた外周36マスの当たり判定。四隅も独立したマスとして残す。
function boardRect(i){
 const C=72;

 else if(n===7){openFreeBuild();return}
 else if(n===8){const a=1+Math.floor(Math.random()*6),b=1+Math.floor(Math.random()*6),amount=(a+b)*50;p.money+=amount;log(`イベント8：${a}+${b} × 50 → +${amount}ドル。`)}
 else if(n===9){if(p.role==='capitalist'){p.money+=200;log('資本家 +200ドル。')}else{players.filter(x=>x.role==='worker'&&x.alive).forEach(w=>w.money+=100);log('労働者全員 +100ドル。')}}
 else if(n===10){p.avoidCards++;log('Go to Jail／検問回避カードを1枚入手（150ドルで売却可）。')}
 else if(n===11){if(p.avoidCards)showChoice('🚨 強制Go to Jail','検問回避カードを使って回避することもできます。',[['カードを使う',()=>{p.avoidCards--;log('回避カードを使用。Go to Jailを回避。');closeModal();updateUI()}],['Go to Jailへ',()=>{goToJail(p,'イベント11');closeModal();checkBankruptcy();updateUI()}]]);else{goToJail(p,'イベント11');updateUI()}return}
 else if(n===12){if(p.role==='capitalist'){const candidates=spaces.map((s,i)=>({s,i})).filter(x=>x.s.t==='weapon'&&!shop[x.i].blocked);if(candidates.length){showChoice('🏭 イベント12','工場に変更する武器屋を選択してください。',candidates.map(x=>[`武器屋（${x.i+1}番）を工場化`,()=>{spaces[x.i].t='factory';delete spaces[x.i].p;capFactoryConvert(x.i);delete shop[x.i];log('武器屋を工場に変更しました。');closeModal();updateUI()}]));return}else log('変更できる武器屋がありません。')}else{openWorkerWeaponConversion();return}}
 checkBankruptcy();checkWin();updateUI()}
function capFactoryConvert(pos){const p=players[0];if(!p.lands.includes(pos))p.lands.push(pos);p.build[pos]={factory:1,house:0}}
function openFreeBuild(){const p=active();if(!p.lands.some(pos=>canBuild(p,pos,true))){log('イベント7：建設できる土地がありません。');updateUI();return}boardMode='freeBuild';updateUI()}
function openWorkerWeaponConversion(){const p=active(),choices=p.lands.filter(pos=>spaceAt(pos).t==='land');if(!choices.length){log('イベント12：武器屋にできる土地がありません。');updateUI();return}showChoice('🔫 イベント12：武器屋化','武器屋に変更する自分の土地を選択してください。',choices.map(pos=>[`土地（${spaceAt(pos).p}ドル）→ 武器屋`,()=>{spaces[pos].t='weapon';delete spaces[pos].p;shop[pos]={available:true,blocked:false};log('自分の土地を武器屋に変更しました。');closeModal();updateUI()}]));}
function checkRevolution(){const total=players.filter(p=>p.role==='worker'&&p.alive).reduce((n,p)=>n+p.weapons,0);const earned=Math.min(2,Math.floor(total/3));if(earned>revolutionCards){const delta=earned-revolutionCards;revolutionCards=earned;log(`🔥 革命カード +${delta}`);log(`労働者全体の武器カード3枚で革命カード1枚。現在 ${revolutionCards} / 2`);}}
function handleBankruptcyPlayer(p){if(!p.alive||p.money>=0)return;showChoice(`💥 ${p.name}：破産判定`,`資産を売却して負債を返済できます。土地は1つ80ドル、建物は1つ70ドル。`,[['全資産を売却',()=>{let cash=0;for(const pos of p.lands.slice()){cash+=80;const b=buildingCount(p,pos);cash+=(b.factory+b.house)*70;delete p.build[pos]}p.lands=[];p.money+=cash;log(`${p.name}：資産を銀行へ売却 → +${cash}ドル。`);if(p.money<0)declareBankrupt(p);closeModal();checkWin();updateUI()}],['売却せず破産',()=>{declareBankrupt(p);closeModal();checkWin();updateUI()}]])}
function declareBankrupt(p){p.alive=false;p.lands=[];p.build={};p.weapons=0;log(`⚠️ ${p.name} が破産。`)}
function checkBankruptcy(){for(const p of players)if(p.alive&&p.money<0){handleBankruptcyPlayer(p);return true}return false}
function checkWin(){if(gameOver)return;if(!players[0].alive){gameOver=true;showEnd('労働者側の勝利！','資本家が破産しました。');return}if(players.filter(p=>p.role==='worker'&&!p.alive).length>=2){gameOver=true;showEnd('資本家側の勝利！','労働者が2人以上破産しました。');return}if(players[0].money>=6000){gameOver=true;showEnd('資本家側の勝利！','資本家が6000ドルに到達しました。');return}if(revolutionCards>=2){gameOver=true;showEnd('労働者側の勝利！','革命カード2枚を獲得しました。')}}
function sellAvoidCard(){const p=active();if(!p.avoidCards)return;p.avoidCards--;p.money+=150;log(`${p.name} が回避カード1枚を150ドルで売却。`);updateUI()}
function showChoice(title,body,opts){choiceFns=opts.map(x=>x[1]);document.getElementById('modal').style.display='flex';document.getElementById('modalbox').innerHTML=`<h2>${title}</h2><div>${body}</div><div class="choices">${opts.map((x,i)=>`<button onclick="choiceFns[${i}]()">${x[0]}</button>`).join('')}</div>`}
function closeModal(){document.getElementById('modal').style.display='none';choiceFns=[]}
function showEnd(title,text){document.getElementById('modal').style.display='flex';document.getElementById('modalbox').innerHTML=`<h2>🏆 ${title}</h2><p>${text}</p><button class="btn primary" onclick="closeModal()">閉じる</button>`}
function showRules(){document.getElementById('modal').style.display='flex';document.getElementById('modalbox').innerHTML=`<h2>📖 Re:VOLUTION ルール</h2><div class="rules"><b>① ゲーム進行</b><br>サイコロ2つを振って出た目の数だけ時計回りに進む。ゾロ目ならもう一度振る。3回ゾロ目でGo to Jailへ。<br><br><b>革命カード</b><br>労働者全体の武器カード3枚で革命カード1枚。2枚で労働者勝利。<br><br><b>ゲーム開始</b><br>資本家は好きな土地3つに工場を1つずつ初期配置。<br><br><b>② マス</b><br>スタート：止まる／通ると200ドル。<br>Go to Jail：止まると武器カード1枚没収。入っている間は金の入手・オークション参加不可。次ターンに150ドルで出る。<br>カジノ：サイコロ2個を振り、出目に応じた配当。<br>イベント：イベントカード。<br>検問：止まった労働者の武器カードをすべて没収。<br>武器屋：労働者300ドルで武器1枚。1店舗1枚まで。購入後は在庫切れ、スタート通過で復活。資本家が止まるとその店を封鎖／解除。<br>市民広場：労働者が止まると労働者全体+100ドル。資本家が止まると労働者全員に100ドルずつ支払う。<br>電力会社：労働者が止まると資本家+300ドル、その労働者-100ドル。資本家は維持費120ドル。<br>土地：資本家無料、労働者は表示価格の2倍。購入時または再度停止時に建物。譲渡・売却不可。<br><br><b>③ 建物</b><br>工場150ドル、1土地2つまで。資本家は土地購入時に必ず1つ。資本家停止で100ドル×工場数。労働者停止で資本家に250ドル×工場数、停止した労働者に50ドル×工場数。<br>家120ドル、1土地3つまで。労働者は土地購入時に必ず1つ。資本家停止で土地価格+100ドル×家数をその労働者へ。労働者停止で資本家に100ドル×家数。<br><br><b>④ 破産</b><br>マイナスになったら土地80ドル、建物70ドルで銀行へ売却可能。売却した土地は無所有。すべて売却してもマイナスなら破産。資本家破産＝労働者勝利、労働者2人以上破産＝資本家勝利。<br><br><b>イベント 2〜12</b><br>2：サイコロの出目×60ドルを敵陣営から奪う。 3：次のマス効果2倍＋再度サイコロ。 4：資本家＝武器回収／労働者＝武器入手。 5：カジノへテレポートし強制開始。 6：スタートに戻る。 7：自分の土地に建物無料。 8：サイコロ2個の和×50ドル。 9：資本家+200／労働者全員+100。 10：Go to Jail／検問回避カード（150ドルで売却可）。 11：強制Go to Jail。 12：資本家＝武器屋を工場化／労働者＝自分の土地を武器屋化。</div><br><button class="btn" onclick="closeModal()">閉じる</button>`}
function endTurn(){if(gameOver||moving||boardMode)return;const p=active();if(!p.alive)return;if(!rolled&&!p.jail)return;closeModal();doublesThisTurn=0;doubleNext=false;rolled=false;current=nextAlive(current);log(`— ${p.name} のターン終了 → ${active().name} のターン —`);updateUI();maybeStartAI()}
function nextAlive(i){for(let k=1;k<=players.length;k++){const j=(i+k)%players.length;if(players[j].alive)return j}return i}
function newGame(){players.forEach(p=>Object.assign(p,{money:p.role==='capitalist'?3500:1500,pos:0,lands:[],build:{},weapons:0,avoidCards:0,alive:true,jail:false,houseBuiltThisStop:false,builtThisStop:false}));spaces.forEach((s,i)=>{if(['factory'].includes(s.t)){s.t='weapon'}}); // 変換済み特殊マスは基本状態へ
 // 土地以外のマスは初期定義どおりに戻す
 const base=['go','land','land','weapon','land','event','square','land','rail','checkpoint','land','weapon','rail','square','land','land','event','land','jail','land','power','land','weapon','land','land','rail','land','casino','land','weapon','land','land','event','land','rail','land'];
 const prices=[null,160,140,null,120,null,null,100,null,null,140,null,null,null,140,150,null,120,null,160,null,140,null,120,150,null,160,null,140,null,150,100,null,120,null,140];
 spaces.forEach((s,i)=>{s.t=base[i];if(prices[i]===null)delete s.p;else s.p=prices[i];s.n=s.t==='jail'?'Go to Jail':s.t==='go'?'スタート':s.t==='land'?'土地':s.t==='weapon'?'武器屋':s.t==='event'?'イベント':s.t==='square'?'市民広場':s.t==='rail'?'鉄道':s.t==='checkpoint'?'検問':s.t==='casino'?'カジノ':s.n});
 resetShops();current=0;rolled=false;moving=false;gameOver=false;boardMode=(humanRole==='capitalist'?'initialFactory':null);initialFactoryChoices=[];doublesThisTurn=0;doubleNext=false;lastDiceSum=0;revolutionCards=0;choiceFns=[];document.getElementById('log').innerHTML='';log(`新しいゲーム開始。あなた：${humanRole==='capitalist'?'資本家':'労働者A'}／残りはCOM。`);closeModal();updateUI();if(humanRole==='worker')setTimeout(aiChooseInitialFactories,400)}
// ボードをマウスドラッグでも横移動できるようにする。
(()=>{const e=document.getElementById('boardScroll');let down=false,startX=0,startLeft=0;e.addEventListener('pointerdown',ev=>{if(ev.target.closest && ev.target.closest('.space'))return;if(ev.pointerType==='mouse'){down=true;startX=ev.clientX;startLeft=e.scrollLeft;e.classList.add('dragging');e.setPointerCapture(ev.pointerId)}});e.addEventListener('pointermove',ev=>{if(down)e.scrollLeft=startLeft-(ev.clientX-startX)});e.addEventListener('pointerup',()=>{down=false;e.classList.remove('dragging')});e.addEventListener('pointercancel',()=>{down=false;e.classList.remove('dragging')})})();
window.addEventListener('error',e=>{const box=document.getElementById('modalbox');const modal=document.getElementById('modal');if(box&&modal){modal.style.display='flex';box.innerHTML='<h2>⚠️ ゲームの読み込みエラー</h2><p style="color:#ff9da5">ページの初期化中にエラーが発生しました。</p><p class="muted">ブラウザを再読み込みしてください。</p>'}});
if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',startRoleChoice)}else{startRoleChoice()}
</script>
